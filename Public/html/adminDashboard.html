<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Administrador - Sistema Municipal</title>
    <link rel="stylesheet" href="../styles/index.css">
    <!-- Iconos sugeridos (ejemplo con FontAwesome) -->
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
</head>

<body>
    <div class="dashboard-wrapper">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Admin Panel</h2>
            </div>
            <nav class="sidebar-nav">
                <ul>
                    <li><a href="adminDashboard.html"><i class="fas fa-home"></i> Dashboard</a></li>
                    <li><a href="#"><i class="fas fa-users"></i> Usuarios</a></li>
                    <li><a href="#"><i class="fas fa-cog"></i> Configuración</a></li>
                    <li><a href="../html/index.html"><i class="fas fa-sign-out-alt"></i> Salir</a></li>
                </ul>
            </nav>
        </aside>

        <main class="dashboard-content">
            <header class="top-bar">
                <div class="user-info">
                    <span>Bienvenido, <strong>Administrador</strong></span>
                </div>
            </header>

            <section class="overview-stats">
                <div class="stat-card">
                    <h3>Total Usuarios</h3>
                    <p class="number">1,250</p>
                </div>
                <div class="stat-card">
                    <h3>Ingresos Hoy</h3>
                    <p class="number">$2,400</p>
                </div>
            </section>

            <section class="recent-activity">
                <h2>Gestión de Reportes Municipales</h2>
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tipo</th>
                            <th>Ubicación</th>
                            <th>Descripción</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="reports-tbody">
                        <!-- Los reportes se cargarán dinámicamente aquí -->
                    </tbody>
                </table>
            </section>
        </main>
    </div>
</body>
<script type="module" src="../js/admistrador.js"></script>

</html>
