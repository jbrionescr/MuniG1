  </header>
  <div class="auth-container">


    <main>
      <img src="../img/1771259929645.png" alt="logomuni" class="imagenlogin">
      <div class="auth-card">
        <h1>Crear Cuenta</h1>
        <p>Regístrate para empezar a gestionar tus trámites.</p>
        <form id="register-form">
          <div class="form-group">
            <label for="fullname">Nombre Completo</label>
            <input type="text" id="fullname" name="fullname" required placeholder="Juan Pérez vargas">
          </div>
          <div class="form-group">
            <label for="email">Correo Electrónico</label>
            <input type="email" id="email" name="email" required placeholder="tu@correo.com">
          </div>
          <div class="form-group">
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
          </div>
          <div class="form-group">
            <label for="confirm-password">Confirmar Contraseña</label>
            <input type="password" id="confirmpassword" name="confirm-password" placeholder="••••••••">
          </div>
          <div class="form-group">
            <label for="role">Tipo de Usuario</label>
            <select id="role" name="role" class="form-control">
              <option value="" disabled selected>Seleccione un rol</option>
              <option value="ciudadano">Ciudadano</option>
              <option value="administrador">Administrador</option>
            </select>
          </div>
          <button id="registerbutton" type="submit" class="btn-primary">Registrarse</button>
        </form>
        <div class="auth-footer">
          ¿Ya tienes una cuenta? <a href="../html/login.html">Inicia sesión</a>
        </div>
      </div>
    </main>
  </div>
