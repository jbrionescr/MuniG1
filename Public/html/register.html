<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Sistema Municipal</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>

<body>
    <div class="auth-container">
        <header>
            <div class="logo">Municipalidad del Sur</div>
            <a href="../html/index.html" class="back-link">Volver al inicio</a>
        </header>

        <main>
            <div class="auth-card">
                <h1>Crear Cuenta</h1>
                <p>Regístrate para empezar a gestionar tus trámites.</p>
                <form id="register-form">
                    <div class="form-group">
                        <label for="fullname">Nombre Completo</label>
                        <input type="text" id="fullname" name="fullname" required placeholder="Juan Pérez vargas">
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="tu@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres">
                    </div>
                    <div class="form-group">
                        <label for="confirm-password">Confirmar Contraseña</label>
                        <input type="password" id="confirmpassword" name="confirm-password" required
                            placeholder="••••••••">
                    </div>
                    <button id = "registerbutton" type="submit" class="btn-primary">Registrarse</button>
                </form>
                <div class="auth-footer">
                    ¿Ya tienes una cuenta? <a href="../html/login.html">Inicia sesión</a>
                </div>
            </div>
        </main>
    </div>
</body>
<script type="module" src="../js/register.js"></script>
</html>
