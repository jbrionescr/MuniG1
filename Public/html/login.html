<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema Municipal</title>
    <link rel="stylesheet" href="../styles/index.css">
</head>

<body>
    <div class="auth-container">
        <header>
            <div class="logo">Municipalidad del Sur</div>
            <a href="../html/index.html" class="back-link">Volver al inicio</a>
        </header>

        <main>
            <div class="auth-card">
                <h1>Iniciar Sesión</h1>
                <p>Ingresa tus credenciales para acceder al sistema.</p>
                <form id="login-form">
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required placeholder="rl123@correo.com">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required placeholder="••••••••">
                    </div>
                    <button id="btnprimary" type="submit" class="btn-primary">Entrar</button>
                </form>
                <div class="auth-footer">
                    ¿No tienes una cuenta? <a href="../html/register.html">Regístrate aquí</a>
                </div>
            </div>
        </main>
    </div>
</body>
<script type="module" src="../js/login.js"></script>
</html>
